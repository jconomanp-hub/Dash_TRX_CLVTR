<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard TRX - Claro VTR</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 font-sans antialiased">
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-slate-900 text-white shadow-md py-4 px-6 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">Dashboard Operativo FTTH - Claro VTR</h1>
            <span id="status-badge" class="text-xs bg-amber-500 text-slate-950 px-3 py-1 rounded-full font-semibold">Cargando datos...</span>
        </header>

        <!-- Main Container -->
        <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
            <!-- Loading State -->
            <div id="loading-container" class="flex flex-col items-center justify-center py-20">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mb-4"></div>
                <p class="text-slate-600 font-medium">Sincronizando telemetría de red y tablas de resumen...</p>
            </div>

            <!-- Dashboard Content (Oculto hasta que carguen los datos) -->
            <div id="dashboard-content" class="hidden space-y-6">
                <!-- Tarjetas de Resumen / KPIs -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        <h3 class="text-xs font-bold text-slate-400 uppercase">Total Registros</h3>
                        <p id="metric-total" class="text-2xl font-black text-slate-800 mt-1">0</p>
                    </div>
                </div>

                <!-- Tabla de Datos Dinámica -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-4 border-b border-slate-100 font-bold text-slate-700">Detalle de Telemetría OLT / FAT</div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-slate-50 text-slate-600 text-xs uppercase">
                                <tr>
                                    <th class="p-3">OLT</th>
                                    <th class="p-3">Cluster</th>
                                    <th class="p-3">Puerto PON</th>
                                    <th class="p-3">FAT</th>
                                    <th class="p-3">Estado</th>
                                    <th class="p-3">KPI / Alarma</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-datos" class="divide-y divide-slate-100 text-sm text-slate-700">
                                <!-- Se llena por JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Script de carga asíncrona y renderizado -->
    <script>
        let globalDataset = [];

        async function cargarDatos() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('No se pudo cargar el archivo data.json');
                
                globalDataset = await response.json();
                
                // Ocultar loader y mostrar dashboard
                document.getElementById('loading-container').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('hidden');
                document.getElementById('status-badge').className = 'text-xs bg-emerald-500 text-white px-3 py-1 rounded-full font-semibold';
                document.getElementById('status-badge').innerText = 'En Línea (' + globalDataset.length + ' registros)';

                // Inicializar visualizaciones y tablas
                renderizarDashboard(globalDataset);

            } catch (error) {
                document.getElementById('loading-container').innerHTML = `
                    <div class="text-red-600 font-bold bg-red-50 p-4 rounded-lg border border-red-200">
                        Error al cargar los datos del dashboard: ${error.message}
                    </div>
                `;
                console.error(error);
            }
        }

        function renderizarDashboard(data) {
            // Actualizar métricas
            document.getElementById('metric-total').innerText = data.length.toLocaleString();

            // Poblar tabla
            const tbody = document.getElementById('tabla-datos');
            tbody.innerHTML = '';

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition-colors';
                tr.innerHTML = `
                    <td class="p-3 font-medium">${item.olt || '-'}</td>
                    <td class="p-3">${item.cluster || '-'}</td>
                    <td class="p-3">${item.puerto || '-'}</td>
                    <td class="p-3">${item.fat || '-'}</td>
                    <td class="p-3"><span class="px-2 py-1 bg-amber-100 text-amber-800 rounded text-xs font-semibold">${item.estado || '-'}</span></td>
                    <td class="p-3 text-slate-500">${item.kpi || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Ejecutar carga al iniciar
        document.addEventListener('DOMContentLoaded', cargarDatos);
    </script>
</body>
</html>
